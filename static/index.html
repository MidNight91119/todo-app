<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO App</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Tasks</h1>
      <div class="add-row">
        <input id="title" type="text" placeholder="What needs doing?" autocomplete="off" />
        <button id="add">Add</button>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="empty" hidden>Nothing here. Add your first task.</p>
    </main>

    <script>
      async function load() {
        const res = await fetch("/tasks");
        const tasks = await res.json();
        // console.log(tasks);
        const list = document.getElementById("list");
        list.innerHTML = "";
        document.getElementById("empty").hidden = tasks.length > 0;
        tasks.forEach((task) => {
          const li = document.createElement("li");
          li.className = "task";

          const title = document.createElement("span");
          title.className = "task-title";
          title.textContent = task.title;
          li.appendChild(title);
          list.appendChild(li);

          const box = document.createElement("input");
          box.type = "checkbox";
          box.className = "task-check";
          box.checked = task.completed;
          box.addEventListener("change", async () => {
            await fetch(`/tasks/${task.id}/complete`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ completed: box.checked }),
            });
            load();
          });
          li.prepend(box);

          const delButton = document.createElement("button");
          delButton.className = "task-delete";
          delButton.textContent = "×";
          delButton.setAttribute("aria-label", "Delete task");
          delButton.addEventListener("click", async () => {
            await fetch(`/tasks/${task.id}`, {
              method: "DELETE",
            });
            load();
          });
          li.append(delButton);

          if (task.completed) li.classList.add("completed");
        });
      }

      document.getElementById("add").addEventListener("click", async () => {
        const input = document.getElementById("title");
        const title = input.value.trim();
        if (!title) return;

        await fetch("/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });

        input.value = "";
        load();
      });

      load();
    </script>
  </body>
</html>
